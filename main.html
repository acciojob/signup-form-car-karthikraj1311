<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	
    <form method="post">
        <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter name" required>
        </div>

        <div><label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="enter email" required>
        </div>
        <div><label for="gender">Gender:</label>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender">
             <label for="female">Female</label>
            <input type="radio" id="female" name="gender">
        </div>
		<div>
			 <label for="age">Age</label>
            <input type="number" name="age" id="age" required placeholder="Age">
		</div>
        <div><label for="cars">Car Brand</label>
            <select name="cars" id="cars">
                <option value="">--Please Choose an option--</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes">Mercedes</option>
                <option value="Ferrari">Ferrari</option>
            </select>
        </div>
        <div><label for="dob">DOB</label>
            <input type="date" name="dob" id="dob">
        </div>
        <div><label for="tel">Phone Number</label>
            <input type="tel" id="tel" required placeholder="xxx-xxx-xxxx">
        </div>
        <div><label for="password">Password</label>
            <input type="password" id="password" required name="password" placeholder="password">
        </div>
        <div><label for="tos">I agree to the TOS</label>
            <input type="checkbox" id="tos" value="agreed" required>
        </div>

		<div>
			         <button type="submit">Submit</button>
		</div>



    </form>
    
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
