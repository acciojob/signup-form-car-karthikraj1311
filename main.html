<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	
    <form method="post">
        <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter name" required>
        </div>

        <div><label for="email">Email</label>
            <input type="text" name="email" id="" placeholder="enter email">
        </div>
        <div><label for="gender">Gender:</label>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender">
             <label for="female">Female</label>
            <input type="radio" id="female" name="gender">
        </div>
        <div><label for="carbrand">Car Brand</label>
            <select name="carbrand" id="carbrand">
                <option value="">--Please Choose an option--</option>
                <option value="BMW">BMW</option>
                <option value="Mercedes">Mercedes</option>
                <option value="Ferrari">Ferrari</option>
            </select>
        </div>
        <div><label for="dob">DOB</label>
            <input type="date" name="dob" id="dob">
        </div>
        <div><label for="Phone">Phone Number</label>
            <input type="tel" id="Phone" required placeholder="xxx-xxx-xxxx">
        </div>
        <div><label for="password">Password</label>
            <input type="password" id="password" required name="password" placeholder="password">
        </div>
        <div><label for="license">I agree to the TOS</label>
            <input type="checkbox" id="license" value="agreed" required>
        </div>
        <div><label for=""></label>
        </div>
		<div>
			         <button>Submit</button>
		</div>



    </form>
    
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
